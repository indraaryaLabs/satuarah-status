name: Probe

# Checks every service, updates the history and publishes it to the `data` branch.
# Scheduled runs are best effort on GitHub's side and can start several minutes late.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write # push the data branch
  issues: write # open and close incident issues

# Runs must never overlap: each one reads the previous state and replaces it.
concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Load previous state
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" data >/dev/null 2>&1; then
            git fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" data:refs/remotes/origin/data
            git show origin/data:state.json > data/state.json
            echo "Loaded state from the data branch"
          else
            echo "No data branch yet, starting with empty state"
          fi

      - name: Check services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node monitor/cli.ts --notify

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          cat > README.md <<'NOTE'
          Generated by the Probe workflow of the main branch. Do not edit.
          This branch always holds exactly one commit: the latest state.
          NOTE
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md state.json status.json
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
