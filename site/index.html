<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SatuArah Status</title>
    <meta
      name="description"
      content="Live availability and response times for PickFrame and other SatuArah products, with 90 days of history."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        This status page needs JavaScript to load live data.
      </p>
    </noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
